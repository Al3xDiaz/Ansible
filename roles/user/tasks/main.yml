---
- name: Copy using inline content
  become: false
  ansible.builtin.blockinfile:
    path: ~/.ssh/config
    mode: u+rw,g-rwx,o-rwx
    block: |
      Host github
          User git
          HostName github.com
      Host gitlab
          User git
          HostName gitlab.com
      Host *
          AddKeysToAgent yes
          PreferredAuthentications publickey,password
          IdentityFile ~/.ssh/id_{{ git_name }}
  ignore_errors: true
