---
- block:
  - name: Eliminar versiones antiguas de Docker si existen
    ansible.builtin.apt:
      name:
        - docker
        - docker-engine
        - docker.io
        - containerd
        - runc
      state: absent
      purge: yes
      autoremove: yes
      update_cache: yes
  - name: Instalar dependencias requeridas
    ansible.builtin.apt:
      name:
        - ca-certificates
        - curl
        - gnupg
        - lsb-release
      state: present
      update_cache: yes
  - name: Crear directorio para keyrings de apt si no existe
    ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'
  - name: Descargar y guardar GPG key de Docker
    ansible.builtin.get_url:
      url: https://download.docker.com/linux/debian/gpg
      dest: /etc/apt/keyrings/docker.gpg
      mode: '0644'
- name: Agregar repositorio de Docker a apt
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_lsb.codename }} stable"
    filename: docker
    state: present
    update_cache: yes
  when:
    - ansible_os_family == "Debian"
    - not ansible_check_mode
- block:
  - name: Instalar Docker y componentes
    ansible.builtin.apt:
      name:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
      state: present
      update_cache: yes
  - name: Asegurar que el usuario actual pertenece al grupo docker
    ansible.builtin.user:
      name: "{{ ansible_user_id }}"
      groups: docker
      append: yes
  when:
    - ansible_os_family == "Debian"
    - not ansible_check_mode
...
